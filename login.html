<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedMe — Login</title>
  <link rel="stylesheet" href="style.css"> </head>
<body>
  <form id="loginForm">
    <input type="email" id="email" required>
    <input type="password" id="password" required>
    <button type="submit" class="submit-btn">LOGIN NOW</button>
  </form>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('http://18.212.234.225:5001/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          // CRITICAL: Store data BEFORE redirecting
          localStorage.setItem('token', data.token);
          localStorage.setItem('user_role', data.user_role);
          localStorage.setItem('user_id', data.user_id);

          // Role-based routing as per rubric [cite: 16, 25]
          const role = data.user_role;
          if (role === 'customer') window.location.href = 'index.html';
          else if (role === 'restaurant') window.location.href = 'restaurant_dashboard.html';
          else if (role === 'rider') window.location.href = 'rider_dashboard.html';
          else window.location.href = 'admin_dashboard.html';
        } else {
          alert(data.message || "Invalid credentials.");
        }
      } catch (err) {
        console.error("Login Error:", err);
        alert("Server connection failed. Check your AWS EC2 instance.");
      }
    }
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
