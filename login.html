<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedMe Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff6b35, #ff9f1c);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .login-header {
      background: #ff5a1f;
      color: white;
      text-align: center;
      padding: 30px 20px 22px;
    }

    .login-header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 15px;
      opacity: 0.95;
    }

    .login-body {
      padding: 28px 24px 30px;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    .tab-btn {
      padding: 12px;
      border: 2px solid #ff5a1f;
      background: white;
      color: #ff5a1f;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.25s;
    }

    .tab-btn.active {
      background: #ff5a1f;
      color: white;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #ff5a1f;
      box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff5a1f;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 6px;
    }

    .login-btn:hover {
      background: #e44c12;
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #ffe7e7;
      color: #b42318;
      border: 1px solid #f5bcbc;
    }

    .message.success {
      background: #e8fff0;
      color: #067647;
      border: 1px solid #b7ebc6;
    }

    .extra-links {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .extra-links a {
      color: #ff5a1f;
      text-decoration: none;
      font-weight: 700;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .demo-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #fff4ee;
      border: 1px solid #ffd8c7;
      font-size: 13px;
      color: #7a3d1f;
      line-height: 1.5;
    }

    .home-link {
      display: inline-block;
      margin-top: 14px;
      color: #ff5a1f;
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .mode-tabs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>FeedMe</h1>
      <p>Login to continue</p>
    </div>

    <div class="login-body">
      <div class="mode-tabs">
        <button type="button" class="tab-btn active" id="userTab">User Login</button>
        <button type="button" class="tab-btn" id="adminTab">Admin Login</button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>

        <div id="messageBox" class="message"></div>
      </form>

      <div class="extra-links">
        <p>Don’t have an account? <a href="register.html">Register here</a></p>
        <a href="index.html" class="home-link">← Back to Home</a>
      </div>

      <div class="demo-box" id="demoBox">
        <strong>Admin demo login:</strong><br>
        Email: admin@feedme.com<br>
        Password: admin123
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const messageBox = document.getElementById("messageBox");
    const userTab = document.getElementById("userTab");
    const adminTab = document.getElementById("adminTab");
    const demoBox = document.getElementById("demoBox");

    let loginMode = "user";

    const API_BASE =
      window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:5000"
        : "http://18.212.234.225:5000";

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = `message ${type}`;
      messageBox.style.display = "block";
    }

    function clearMessage() {
      messageBox.style.display = "none";
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setMode(mode) {
      loginMode = mode;
      clearMessage();

      if (mode === "user") {
        userTab.classList.add("active");
        adminTab.classList.remove("active");
        demoBox.innerHTML = `
          <strong>User login:</strong><br>
          Use the account you created from the registration page.
        `;
      } else {
        adminTab.classList.add("active");
        userTab.classList.remove("active");
        demoBox.innerHTML = `
          <strong>Admin demo login:</strong><br>
          Email: admin@feedme.com<br>
          Password: admin123
        `;
      }
    }

    userTab.addEventListener("click", () => setMode("user"));
    adminTab.addEventListener("click", () => setMode("admin"));

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        showMessage("Please enter email and password.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";

      try {
        if (loginMode === "admin") {
          if (email === "admin@feedme.com" && password === "admin123") {
            localStorage.setItem("feedmeToken", "admin-demo-token");
            localStorage.setItem("feedmeUserRole", "admin");
            localStorage.setItem(
              "feedmeUser",
              JSON.stringify({
                name: "Admin",
                email: "admin@feedme.com",
                role: "admin"
              })
            );

            showMessage("Admin login successful. Redirecting...", "success");

            setTimeout(() => {
              window.location.href = "admin.html";
            }, 800);
          } else {
            showMessage("Invalid admin email or password.", "error");
          }
        } else {
          const response = await fetch(`${API_BASE}/api/auth/login`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            showMessage(data.message || "Login failed.", "error");
          } else {
            localStorage.setItem("feedmeToken", data.token || "");
            localStorage.setItem("feedmeUserRole", data.user?.role || "user");
            localStorage.setItem("feedmeUser", JSON.stringify(data.user || {}));

            showMessage("Login successful. Redirecting...", "success");

            setTimeout(() => {
              window.location.href = "index.html";
            }, 800);
          }
        }
      } catch (error) {
        console.error("Login error:", error);
        showMessage("Unable to connect to server.", "error");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });

    setMode("user");
  </script>
</body>
</html>
