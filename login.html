
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FeedMe — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--orange:#FF4D00;--dark:#1A1A1A;--light:#F5F4F0;--white:#fff;--gray:#888;--border:#E0DDD8;--font:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace}
  body{font-family:var(--font);background:var(--light);color:var(--dark);min-height:100vh;display:flex;flex-direction:column}
  a{text-decoration:none;color:inherit}

  nav{background:var(--white);border-bottom:2px solid var(--dark);display:flex;align-items:center;padding:0 40px;height:64px;gap:32px}
  .logo{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--orange);border:2px solid var(--orange);padding:4px 12px;border-radius:4px}
  .nav-right{margin-left:auto;display:flex;gap:10px}
  .btn{padding:8px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s;border:2px solid var(--dark)}
  .btn-outline{background:transparent;color:var(--dark)}
  .btn-outline:hover{background:var(--dark);color:var(--white)}

  .page-wrap{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 64px)}

  .left-panel{background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:20px;position:relative;overflow:hidden}
  .left-panel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 20px,rgba(255,255,255,.02) 20px,rgba(255,255,255,.02) 40px)}
  .left-panel .emoji{font-size:64px;position:relative;z-index:1}
  .left-panel h2{font-size:28px;font-weight:800;color:var(--white);position:relative;z-index:1;text-align:center}
  .left-panel p{font-size:14px;color:#aaa;font-family:var(--mono);text-align:center;line-height:1.7;position:relative;z-index:1}
  .orange-bar{width:60px;height:4px;background:var(--orange);border-radius:2px;position:relative;z-index:1}

  .right-panel{display:flex;align-items:center;justify-content:center;padding:60px 80px}
  .form-box{width:100%;max-width:400px}
  .form-title{font-size:26px;font-weight:800;margin-bottom:6px}
  .form-sub{font-size:13px;color:var(--gray);font-family:var(--mono);margin-bottom:32px}

  .form-group{margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px;font-family:var(--mono)}
  input[type=email],input[type=password],input[type=text],input[type=tel],select,textarea{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:var(--font);background:var(--white);outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--dark)}
  .input-error{border-color:#EF4444!important}
  .error-msg{font-size:12px;color:#EF4444;font-family:var(--mono);margin-top:6px;padding:8px 12px;background:#FEF2F2;border-radius:6px;border:1px solid #FECACA;display:none}
  .error-msg.show{display:block}

  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13px}
  .check-row input{width:auto}
  .forgot{font-size:13px;color:var(--orange);cursor:pointer;font-weight:600}
  .forgot:hover{text-decoration:underline}

  .submit-btn{width:100%;padding:15px;background:var(--orange);color:var(--white);border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:background .2s;letter-spacing:.5px}
  .submit-btn:hover{background:#e04400}

  .divider{display:flex;align-items:center;gap:12px;margin:20px 0}
  .divider-line{flex:1;height:1px;background:var(--border)}
  .divider-text{font-size:12px;color:var(--gray);font-family:var(--mono)}

  .google-btn{width:100%;padding:13px;background:var(--white);color:var(--dark);border:2px solid var(--border);border-radius:8px;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:10px}
  .google-btn:hover{border-color:var(--dark);background:var(--light)}

  .bottom-link{text-align:center;margin-top:24px;font-size:14px;color:var(--gray)}
  .bottom-link a{color:var(--orange);font-weight:700}
  .bottom-link a:hover{text-decoration:underline}

  @media(max-width:768px){
    .page-wrap{grid-template-columns:1fr}
    .left-panel{display:none}
    .right-panel{padding:40px 24px}
  }
</style>
</head>
<body>

<nav>
  <a href="index.html"><div class="logo">FeedMe</div></a>
  <div class="nav-right">
    <button class="btn btn-outline" onclick="location.href='register.html'">Register</button>
  </div>
</nav>

<div class="page-wrap">
  <div class="left-panel">
    <div class="emoji">🍔</div>
    <h2>Welcome back!</h2>
    <p>Order your favourite food<br>from anywhere, anytime.</p>
    <div class="orange-bar"></div>
  </div>

  <div class="right-panel">
    <div class="form-box">
      <div class="form-title">Sign In</div>
      <div class="form-sub">Enter your credentials below</div>

      <div id="error-alert" class="error-msg">Invalid email or password. Please try again.</div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="user@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="row">
          <div class="check-row">
            <input type="checkbox" id="remember">
            <label for="remember" style="margin:0;text-transform:none;font-size:13px;letter-spacing:0;font-family:var(--font)">Remember me</label>
          </div>
          <span class="forgot">Forgot password?</span>
        </div>
        <button type="submit" class="submit-btn">LOGIN</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <button class="google-btn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="bottom-link">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  // Demo: any login goes to home
  if (email && password) {
    window.location.href = 'index.html';
  } else {
    document.getElementById('error-alert').classList.add('show');
  }
}
</script>
</body>
</html>
