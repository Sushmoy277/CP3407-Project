<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FeedMe — Cart</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--orange:#FF4D00;--dark:#1A1A1A;--light:#F5F4F0;--white:#fff;--gray:#888;--border:#E0DDD8;--green:#10B981;--font:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace}
  body{font-family:var(--font);background:var(--light);color:var(--dark)}
  a{text-decoration:none;color:inherit}
  nav{background:var(--white);border-bottom:2px solid var(--dark);display:flex;align-items:center;padding:0 40px;height:64px;gap:24px}
  .logo{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--orange);border:2px solid var(--orange);padding:4px 12px;border-radius:4px;cursor:pointer}
  .back-link{font-size:13px;font-weight:600;color:var(--gray);cursor:pointer}
  .back-link:hover{color:var(--dark)}
  .btn{padding:10px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s;border:2px solid}
  .btn-orange{background:var(--orange);color:var(--white);border-color:var(--orange)}
  .btn-orange:hover{background:#e04400}
  .btn-outline{background:transparent;color:var(--dark);border-color:var(--dark)}
  .btn-outline:hover{background:var(--dark);color:var(--white)}

  .main{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:40px;max-width:1200px;margin:0 auto}
  .section-title{font-size:20px;font-weight:800;margin-bottom:20px}

  .cart-item{background:var(--white);border:2px solid var(--border);border-radius:12px;padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:14px;transition:border-color .2s}
  .cart-item:hover{border-color:var(--dark)}
  .item-img{width:64px;height:64px;background:#E8E6E0;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
  .item-info{flex:1}
  .item-name{font-size:15px;font-weight:700;margin-bottom:3px}
  .item-from{font-size:12px;color:var(--gray);font-family:var(--mono);margin-bottom:4px}
  .item-price{font-size:15px;font-weight:800;color:var(--orange)}
  .item-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .qty-control{display:flex;align-items:center;border:2px solid var(--dark);border-radius:8px;overflow:hidden}
  .qty-btn{width:32px;height:32px;background:var(--light);border:none;font-size:16px;cursor:pointer;transition:background .2s;font-family:var(--font)}
  .qty-btn:hover{background:var(--dark);color:var(--white)}
  .qty-num{width:32px;text-align:center;font-size:14px;font-weight:700;font-family:var(--mono)}
  .remove-btn{font-size:12px;color:#EF4444;cursor:pointer;font-family:var(--mono);font-weight:600}
  .remove-btn:hover{text-decoration:underline}

  .promo-row{display:flex;gap:0;margin-top:8px}
  .promo-input{flex:1;padding:12px 16px;border:2px solid var(--border);border-right:none;border-radius:8px 0 0 8px;font-size:13px;font-family:var(--font);outline:none}
  .promo-input:focus{border-color:var(--dark)}
  .promo-btn{padding:0 20px;background:var(--dark);color:var(--white);border:2px solid var(--dark);border-radius:0 8px 8px 0;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer}
  .promo-btn:hover{background:var(--orange);border-color:var(--orange)}

  .summary-card{background:var(--white);border:2px solid var(--border);border-radius:12px;padding:24px;position:sticky;top:80px}
  .summary-title{font-size:17px;font-weight:800;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid var(--border)}
  .summary-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:12px}
  .summary-row .label{color:var(--gray)}
  .summary-row .value{font-weight:600;font-family:var(--mono)}
  .summary-row.discount .value{color:var(--green)}
  .summary-divider{border:none;border-top:2px solid var(--border);margin:16px 0}
  .summary-total{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;margin-bottom:20px}
  .summary-total .value{color:var(--orange)}
  .checkout-btn{width:100%;padding:15px;background:var(--orange);color:var(--white);border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:background .2s;margin-bottom:10px}
  .checkout-btn:hover{background:#e04400}
  .continue-btn{width:100%;padding:13px;background:transparent;color:var(--dark);border:2px solid var(--dark);border-radius:8px;font-size:14px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .2s}
  .continue-btn:hover{background:var(--dark);color:var(--white)}
  .info-note{font-size:12px;color:var(--gray);font-family:var(--mono);text-align:center;margin-top:12px;padding:10px;background:var(--light);border-radius:6px}

  .empty-cart{text-align:center;padding:80px 40px;background:var(--white);border:2px solid var(--border);border-radius:12px}
  .empty-cart .emoji{font-size:64px;display:block;margin-bottom:16px}
  .empty-cart h3{font-size:20px;font-weight:700;margin-bottom:8px}
  .empty-cart p{font-size:14px;color:var(--gray);margin-bottom:24px}

  @media(max-width:800px){.main{grid-template-columns:1fr;padding:20px}}
</style>
</head>
<body>
<nav>
  <div class="logo" onclick="location.href='index.html'">FeedMe</div>
  <div class="back-link" onclick="location.href='menu.html'">← Continue Shopping</div>
  <div class="btn btn-orange" style="margin-left:auto" onclick="location.href='cart.html'">🛒 Cart (<span id="nav-count">0</span>)</div>
</nav>

<div class="main">
  <div>
    <div class="section-title">Your Cart (<span id="item-count">0</span> items)</div>
    <div id="cart-items"></div>
    <div style="margin-top:20px">
      <label style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);display:block;margin-bottom:8px">Promo Code</label>
      <div class="promo-row">
        <input class="promo-input" type="text" placeholder="Enter promo code...">
        <button class="promo-btn">APPLY</button>
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">Order Summary</div>
    <div class="summary-card">
      <div class="summary-title">Items in Cart</div>
      <div class="summary-row"><span class="label">Subtotal</span><span class="value" id="subtotal">$0.00</span></div>
      <div class="summary-row"><span class="label">Delivery Fee</span><span class="value">$2.99</span></div>
      <div class="summary-row discount"><span class="label">Promo Discount</span><span class="value">-$0.00</span></div>
      <hr class="summary-divider">
      <div class="summary-total"><span>TOTAL</span><span class="value" id="total">$2.99</span></div>
      <button class="checkout-btn" onclick="location.href='checkout.html'">PROCEED TO CHECKOUT →</button>
      <button class="continue-btn" onclick="location.href='restaurants.html'">← CONTINUE SHOPPING</button>
      <div class="info-note">🚚 Free delivery on orders over $30</div>
    </div>
  </div>
</div>

<script>
let cart = JSON.parse(localStorage.getItem('feedme_cart')||'[]');
const emojis = {'Classic Beef Burger':'🍔','Double Smash Burger':'🍔','Crispy Chicken Burger':'🍗','Fries (Large)':'🍟','Onion Rings':'🧅','Soft Drink':'🥤','Milkshake':'🥛'};

function render() {
  const container = document.getElementById('cart-items');
  const totalItems = cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('item-count').textContent = totalItems;
  document.getElementById('nav-count').textContent = totalItems;
  if (cart.length === 0) {
    container.innerHTML = <div class="empty-cart"><span class="emoji">🛒</span><h3>Your cart is empty</h3><p>Add items from a restaurant to get started</p><button class="btn btn-orange" onclick="location.href='restaurants.html'" style="padding:12px 28px;border-radius:8px;cursor:pointer">BROWSE RESTAURANTS</button></div>;
    document.getElementById('subtotal').textContent='$0.00';
    document.getElementById('total').textContent='$2.99';
    return;
  }
  container.innerHTML = cart.map((item,i) => `
    <div class="cart-item">
      <div class="item-img">${emojis[item.name]||'🍽️'}</div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-from">Burger Palace</div>
        <div class="item-price">$${item.price.toFixed(2)}</div>
      </div>
      <div class="item-right">
        <div class="qty-control">
          <button class="qty-btn" onclick="changeQty(${i},-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
        </div>
        <div class="remove-btn" onclick="removeItem(${i})">Remove</div>
      </div>
    </div>`).join('');
  const sub = cart.reduce((s,i)=>s+(i.price*i.qty),0);
  document.getElementById('subtotal').textContent=$${sub.toFixed(2)};
  document.getElementById('total').textContent=$${(sub+2.99).toFixed(2)};
}

function changeQty(i,delta){
  cart[i].qty+=delta;
  if(cart[i].qty<=0)cart.splice(i,1);
  localStorage.setItem('feedme_cart',JSON.stringify(cart));
  render();
}
function removeItem(i){cart.splice(i,1);localStorage.setItem('feedme_cart',JSON.stringify(cart));render();}
render();
</script>
</body>
</html>
