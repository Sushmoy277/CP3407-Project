<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FeedMe — Rider Dashboard</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--orange:#FF4D00;--dark:#1A1A1A;--light:#F5F4F0;--white:#fff;--gray:#888;--border:#E0DDD8;--green:#10B981;--blue:#3B82F6;--font:'Sora',sans-serif;--mono:'IBM Plex Mono',monospace}
  body{font-family:var(--font);background:var(--light);color:var(--dark);display:flex;min-height:100vh}
  .sidebar{width:240px;background:var(--dark);flex-shrink:0;display:flex;flex-direction:column}
  .sidebar-brand{padding:20px;border-bottom:1px solid #333}
  .sidebar-avatar{width:48px;height:48px;border-radius:50%;background:#333;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
  .sidebar-name{font-size:14px;font-weight:700;color:var(--white)}
  .sidebar-sub{font-size:11px;color:#888;font-family:var(--mono);margin-top:2px}
  .online-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(16,185,129,.2);color:var(--green);font-size:11px;font-family:var(--mono);padding:3px 8px;border-radius:4px;margin-top:8px;font-weight:700}
  .sidebar-section{font-size:10px;font-family:var(--mono);color:#555;text-transform:uppercase;letter-spacing:2px;padding:14px 20px 5px}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:13px;font-weight:600;color:#aaa;cursor:pointer;transition:all .2s;text-decoration:none}
  .sidebar-item:hover{color:var(--white);background:rgba(255,255,255,.05)}
  .sidebar-item.active{color:var(--white);background:var(--orange)}
  .main{flex:1;overflow:auto}
  .topbar{background:var(--white);border-bottom:2px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
  .topbar-title{font-size:18px;font-weight:800}
  .toggle-btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);border:2px solid var(--green);background:transparent;color:var(--green)}
  .content{padding:28px 32px}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .stat-card{background:var(--white);border:2px solid var(--border);border-left:5px solid var(--orange);border-radius:10px;padding:16px 20px}
  .stat-card:nth-child(2){border-left-color:var(--green)}
  .stat-card:nth-child(3){border-left-color:var(--blue)}
  .stat-val{font-size:26px;font-weight:800;font-family:var(--mono)}
  .stat-label{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;font-family:var(--mono);margin-top:4px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .panel{background:var(--white);border:2px solid var(--border);border-radius:10px;padding:20px}
  .panel-title{font-size:14px;font-weight:800;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--border)}
  .delivery-card{border:2px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .delivery-card.urgent{border-color:var(--orange);background:#FFF5F2}
  .d-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .d-num{font-size:13px;font-weight:800;font-family:var(--mono)}
  .d-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;font-family:var(--mono)}
  .b-pickup{background:#FEF3C7;color:#92400E}
  .b-onway{background:#DBEAFE;color:#1E40AF}
  .b-done{background:#D1FAE5;color:#065F46}
  .d-info{font-size:12px;color:var(--gray);font-family:var(--mono);margin-bottom:5px;display:flex;align-items:flex-start;gap:6px}
  .action-btn{width:100%;padding:10px;border-radius:8px;font-size:13px;font-weight:700;font-family:var(--font);cursor:pointer;border:none;margin-top:8px}
  .action-orange{background:var(--orange);color:var(--white)}
  .action-green{background:var(--green);color:var(--white)}
  .map-box{background:#E8E6E0;border:2px solid var(--border);border-radius:10px;height:280px;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:var(--mono);color:var(--gray)}
  .info-note{font-size:12px;font-family:var(--mono);color:var(--gray);text-align:center;margin-top:10px;padding:8px;background:var(--light);border-radius:6px}
  @media(max-width:900px){.sidebar{display:none}.two-col{grid-template-columns:1fr}.stats-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-brand">
    <div class="sidebar-avatar">😎</div>
    <div class="sidebar-name">Rider Dashboard</div>
    <div class="sidebar-sub">Live delivery panel</div>
    <div class="online-badge">● ONLINE</div>
  </div>
  <div class="sidebar-section">DELIVERIES</div>
  <a class="sidebar-item active" href="rider.html">📦 My Deliveries</a>
  <a class="sidebar-item" href="login.html">🚪 Logout</a>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">My Deliveries</div>
    <button class="toggle-btn" onclick="toggleStatus(this)">● GO OFFLINE</button>
  </div>

  <div class="content">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val" id="activeCount">0</div><div class="stat-label">Active Orders</div></div>
      <div class="stat-card"><div class="stat-val" id="todayEarnings">$0.00</div><div class="stat-label">Today's Earnings</div></div>
      <div class="stat-card"><div class="stat-val">Live</div><div class="stat-label">Rider Status</div></div>
    </div>

    <div class="two-col">
      <div>
        <div class="panel-title" style="font-size:16px;font-weight:800;margin-bottom:16px">Active Deliveries</div>
        <div id="deliveriesList"></div>
      </div>

      <div>
        <div class="panel-title" style="font-size:16px;font-weight:800;margin-bottom:16px">Delivery Map</div>
        <div class="map-box">🗺️ Live Route View</div>
        <div class="info-note">📍 Your location is shared in real-time</div>
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://18.212.234.225:5001/api";
const SOCKET_BASE = "http://18.212.234.225:5001";

const token = localStorage.getItem("token");
const riderId = localStorage.getItem("user_id");

if (!token) {
  alert("Please login first.");
  window.location.href = "login.html";
}

const socket = io(SOCKET_BASE);

socket.on("connect", () => {
  if (riderId) {
    socket.emit("join_rider_room", riderId);
  }
});

socket.on("delivery_assigned", () => {
  loadDeliveries();
});

function toggleStatus(btn){
  const online = btn.textContent.includes('OFFLINE');
  btn.textContent = online ? '● GO ONLINE' : '● GO OFFLINE';
}

async function loadDeliveries() {
  try {
    const res = await fetch(`${API_BASE}/delivery/rider/my`, {
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    const data = await res.json();

    const list = document.getElementById("deliveriesList");
    list.innerHTML = "";

    let activeCount = 0;
    let earnings = 0;

    data.forEach(delivery => {
      const isCompleted = delivery.delivery_status === "delivered";
      if (!isCompleted) activeCount++;

      earnings += Number(delivery.total_amount || 0);

      const badgeClass =
        delivery.delivery_status === "assigned" ? "b-pickup" :
        delivery.delivery_status === "picked_up" || delivery.delivery_status === "on_the_way" ? "b-onway" :
        "b-done";

      const badgeText =
        delivery.delivery_status === "assigned" ? "PICK UP NOW" :
        delivery.delivery_status === "picked_up" || delivery.delivery_status === "on_the_way" ? "ON THE WAY" :
        "COMPLETED";

      let buttonHtml = "";
      if (delivery.delivery_status === "assigned") {
        buttonHtml = `<button class="action-btn action-orange" onclick="updateDeliveryStatus(${delivery.delivery_id}, 'picked_up')">MARK AS PICKED UP</button>`;
      } else if (delivery.delivery_status === "picked_up" || delivery.delivery_status === "on_the_way") {
        buttonHtml = `<button class="action-btn action-green" onclick="updateDeliveryStatus(${delivery.delivery_id}, 'delivered')">✓ MARK AS DELIVERED</button>`;
      }

      list.innerHTML += `
        <div class="delivery-card ${delivery.delivery_status === 'assigned' ? 'urgent' : ''}">
          <div class="d-top">
            <span class="d-num">#ORD-${delivery.order_id}</span>
            <span class="d-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="d-info">🍔 Restaurant: ${delivery.restaurant_name || 'Restaurant'}</div>
          <div class="d-info">🏠 Deliver to: ${delivery.delivery_address}</div>
          <div class="d-info">👤 Customer: ${delivery.customer_name || 'Customer'}</div>
          <div class="d-info">💰 Order total: $${Number(delivery.total_amount || 0).toFixed(2)}</div>
          ${buttonHtml}
        </div>
      `;
    });

    document.getElementById("activeCount").textContent = activeCount;
    document.getElementById("todayEarnings").textContent = `$${earnings.toFixed(2)}`;
  } catch (err) {
    console.error("Failed to load deliveries:", err);
  }
}

async function updateDeliveryStatus(deliveryId, status) {
  try {
    const res = await fetch(`${API_BASE}/delivery/${deliveryId}/status`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ delivery_status: status })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.message || "Failed to update delivery.");
      return;
    }

    loadDeliveries();
  } catch (err) {
    console.error(err);
    alert("Error updating delivery status.");
  }
}

loadDeliveries();
setInterval(loadDeliveries, 5000);
</script>
</body>
</html>
